[package]
name = "trovara-app"
version = "1.0.0-beta.1"
description = "Trovara: the tray icon, the hotkey, the search panel and window, setup and settings, over trovara-helper"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/Subhankar-Patra1/trovara"
authors = ["Subhankar Patra"]

[[bin]]
name = "trovara"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
