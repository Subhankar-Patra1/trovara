[package]
name = "trovara-helper"
description = "Trovara's worker process and CLI: estimate, index, search, status, speed, eval, index-service, search-service, download-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "trovara-helper"
path = "src/main.rs"

[dependencies]
trovara-core.workspace = true
trovara-win.workspace = true
trovara-extract.workspace = true
trovara-llama.workspace = true
serde_json.workspace = true
serde.workspace = true
notify = "8"
ignore = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
